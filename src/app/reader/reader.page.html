<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ documentTitle }}</ion-title>
    
    <!-- PDF Zoom Controls -->
    <ion-buttons slot="end" *ngIf="documentType === 'pdf'">
      <ion-button (click)="zoomOut()">
        <ion-icon slot="icon-only" name="remove-circle-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="zoomIn()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- HTML Reader -->
  <div class="reader-container" *ngIf="documentType === 'html' && safeHtmlUrl">
    <iframe [src]="safeHtmlUrl" class="html-iframe"></iframe>
  </div>

  <!-- PDF Reader -->
  <div class="reader-container" *ngIf="documentType === 'pdf'">
    <pdf-viewer 
      [src]="documentUrl" 
      [render-text]="true"
      [original-size]="false"
      [zoom]="zoomLevel"
      style="display: block; width: 100%; height: 100%;">
    </pdf-viewer>
  </div>

  <!-- Error State -->
  <div class="error-container" *ngIf="documentType === 'unknown'">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>Unsupported document type.</p>
  </div>
</ion-content>
